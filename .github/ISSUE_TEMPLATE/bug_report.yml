name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please do not paste real task data, tokens or backups. For security issues, follow SECURITY.md instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Timesheet tab
        2. Drag a task to Tuesday
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 26
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [Tiếng Việt, English, Français]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
