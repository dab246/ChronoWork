<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#4f46e5" />
    <title>ChronoWork</title>
    <meta name="description" content="Daily work log, attendance and weekly performance report." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(circle at 50% 40%, #4f46e5 0%, #312e81 70%, #1e1b4b 100%);
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 400ms ease, visibility 400ms ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-logo {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pop 700ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #splash .splash-logo svg .hand {
        transform-origin: 24px 26px;
        animation: splash-spin 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #splash .splash-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        animation: splash-rise 700ms 150ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #splash .splash-bar {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
        animation: splash-rise 700ms 250ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #splash .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #fff;
        animation: splash-progress 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased font-sans">
    <div id="splash" role="status" aria-label="ChronoWork">
      <div class="splash-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="26" r="15" stroke="#fff" stroke-width="3.5" />
          <path d="M19 6h10" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
          <path class="hand" d="M24 26V17" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
          <circle cx="24" cy="26" r="2.5" fill="#fff" />
        </svg>
      </div>
      <div class="splash-title">ChronoWork</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
